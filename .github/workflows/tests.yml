name: Agent validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m scripts.test_report
      - run: python -m scripts.evaluate --output runtime/ci-examples
      - run: python -m scripts.hardening_examples --output runtime/ci-hardening
      - run: python -m scripts.verify_evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-${{ matrix.python-version }}-evidence
          path: |
            examples/tests
            runtime/ci-examples
            runtime/ci-hardening
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start local workbench
        run: |
          python -m src.web --port 8770 --db runtime/ci-browser.db > /tmp/q4-web.log 2>&1 &
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8770/api/health && break
            sleep 1
          done
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: examples/browser
