<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>短视频脚本 · 有据可依</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body><a class="skip-link" href="#workspace-main">跳到主要内容</a>
<header class="topbar"><a class="brand" href="/">C / SCRIPT STUDIO <span>项目 04</span></a><a href="/manual.html">使用手册 ↗</a></header><main id="workspace-main">
<section class="hero"><div><h1>短视频脚本</h1><p class="intro">依据素材生成可编辑分镜。时长为估算，不生成或发布视频。</p></div></section>
<div class="workspace"><section class="card setup"><div class="section-heading"><h2>01 / 创作要求</h2></div><label for="scenario">演示场景</label><select id="scenario"></select><p class="help">切换场景会新建请求；可在高级配置中填写初稿。</p>
<form id="script-form"><label for="topic">主题</label><input id="topic" maxlength="500"><label for="audience">受众</label><input id="audience" maxlength="500"><div class="fields"><div><label for="platform">平台</label><input id="platform" value="抖音"></div><div><label for="target">目标时长上限 / 秒</label><input id="target" type="number" min="1" max="600" step="0.1"></div></div><label for="style">风格</label><select id="style"><option>简洁</option><option>活泼</option><option>沉稳</option></select><label for="mode">决策方式</label><select id="mode"><option value="mock">离线演练 · 不代表模型效果</option><option value="real">真实模型 · 本地 Qwen</option></select><p class="help" id="model-info"></p>
<details><summary>请求、素材与初稿 / 高级配置</summary><label for="request-id">请求 ID</label><input id="request-id" maxlength="128" required><button type="button" id="new-id" class="secondary">生成新 ID</button><label for="max-steps">模型步数上限</label><input id="max-steps" type="number" min="1" max="100" value="16"><label for="catalog">产品素材与品牌规则 / JSON</label><textarea id="catalog" rows="9"></textarea><label for="initial">已有草稿 / JSON，可留空</label><textarea id="initial" rows="6"></textarea></details><button class="primary" id="run" type="submit">生成 / 优化脚本 <span aria-hidden="true">→</span></button></form><p id="notice" role="status" aria-live="polite">正在连接…</p></section>
<section class="card results"><div class="section-heading"><h2>02 / 脚本与检查</h2><span class="tag" id="state">等待开始</span></div><div class="metrics"><div><small>预计总时长</small><strong id="duration">—</strong></div><div><small>当前版本</small><strong id="revision">—</strong></div><div><small>脚本状态</small><strong id="ready">未检查</strong></div></div><div class="empty" id="empty"><h3>暂无脚本</h3><p>生成后可编辑分镜，并核对时长与事实来源。</p></div>
<div id="result" hidden><p id="reason" class="result-reason"></p><div id="risks"></div><h3 id="script-title"></h3><div id="scenes"></div><details id="sources-panel"><summary>素材来源与事实原文</summary><div id="sources"></div></details>
<div class="actions"><button id="resume" class="primary" type="button">让 Agent 继续处理</button><button id="download" class="secondary" type="button">导出脚本与记录</button></div>
<details id="editor-panel"><summary>编辑脚本并重新检查</summary><p class="help">复查保留你的文字；需要模型修订时，点击“让 Agent 继续处理”。</p><label for="editor">脚本 JSON</label><textarea id="editor" rows="15" spellcheck="false"></textarea><button id="review" type="button" class="secondary">检查我的修改</button><p id="edit-state" role="status" class="help"></p></details>
<details><summary>模型动作与工具观察</summary><div id="trace"></div></details></div></section></div>
<section class="card archive"><div class="section-heading"><h2>03 / 本地任务记录</h2><button type="button" class="secondary" id="refresh">刷新列表</button></div><div id="archive"></div></section><footer>本地工作台 · 产品文案须有素材依据</footer></main></body></html>
